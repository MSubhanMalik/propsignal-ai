<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parakh Error and No internet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Nastaliq+Urdu:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF8F2}
.L h1,.L p{margin:0}
.L-en{font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.55}
.L-ur{font-family:'Noto Nastaliq Urdu',serif;line-height:2.1}
.L-en .h{letter-spacing:-0.03em;line-height:1.08}
.L-ur .h{line-height:1.75}
a{color:#1D4A9E;text-underline-offset:3px}
.lat{font-family:'Plus Jakarta Sans',sans-serif}
.lb{min-height:40px;padding:0 10px;border:0;background:transparent;color:#5E5A50;cursor:pointer;font-size:14px}
.lb.on{color:#1D4A9E;font-weight:700;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.lb-en{font-family:'Plus Jakarta Sans',sans-serif}.lb-ur{font-family:'Noto Nastaliq Urdu',serif;font-size:14px}
.wrap{max-width:1240px;margin:0 auto;padding-left:40px;padding-right:40px;box-sizing:border-box}
@media (max-width:900px){.wrap{padding-left:18px;padding-right:18px}}
.flip{transition:transform .2s}[dir=rtl] .flip{transform:scaleX(-1)}
</style>
</helmet>
<div class="{{langClass}}" dir="{{dir}}" lang="{{lang}}" style="width: 100%; min-height: 100vh; box-sizing: border-box; background: #FBF8F2; color: #1A1D24; font-size: 17px; display: flex; flex-direction: column">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E3DACA">
    <div class="wrap" style="padding-top: 14px; padding-bottom: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <span style="display: flex; align-items: baseline; gap: 10px"><span class="lat" style="font-weight: 800; font-size: 26px; letter-spacing: -0.03em; color: #1D4A9E">Parakh</span><span style="font-family: 'Noto Nastaliq Urdu', serif; font-size: 18px; color: #1D4A9E; line-height: 1">پرکھ</span></span>
      <div role="group" aria-label="Language" style="display: flex"><sc-for list="{{langs}}" as="l" hint-placeholder-count="2"><button type="button" class="{{l.cls}}" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}">{{l.label}}</button></sc-for></div>
    </div>
  </header>
  <main class="wrap" style="width: 100%; flex: 1; padding-top: 96px; padding-bottom: 96px; display: flex; justify-content: center">
    <section role="alert" style="width: 100%; max-width: 640px; background: #FFFFFF; border: 1px solid #E3DACA; padding: 48px 44px; display: flex; flex-direction: column; gap: 18px; align-items: flex-start">
      <span style="width: 64px; height: 64px; border-radius: 999px; background: #F2EBDD; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{isError}}" hint-placeholder-val="{{true}}"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20zM12 10v4M12 17v.5" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
        <sc-if value="{{isOffline}}" hint-placeholder-val="{{false}}"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01M3 3l18 18" fill="none" stroke="#1A1D24" stroke-width="2" stroke-linecap="round"></path></svg></sc-if>
      </span>
      <h1 class="h" style="font-size: clamp(30px, 3.6vw, 42px); font-weight: 800">{{c.title}}</h1>
      <p style="font-size: 19px; color: #4A463D">{{c.text}}</p>
      <div style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center">
        <button type="button" style="min-height: 56px; padding: 0 26px; border: 0; background: #1D4A9E; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 10px"><svg class="flip" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{t.retry}}</button>
        <a href="#" style="min-height: 56px; padding: 0 20px; display: inline-flex; align-items: center; border: 2px solid #1D4A9E; text-decoration: none; font-size: 17px; font-weight: 700">{{t.home}}</a>
      </div>
      <p style="font-size: 16px; color: #5E5A50; border-top: 1px solid #EFE8DA; padding-top: 16px; width: 100%">{{c.extra}} <a href="#">{{t.help}}</a></p>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["error","offline"],"default":"error"},"startLang":{"editor":"enum","options":["en","ur"],"default":"en"},"$preview":{"width":1280,"height":900}}'>
var PS = {
  en: { dir: 'ltr', name: 'English', retry: 'Try again', home: 'Go to home', help: 'Get help on WhatsApp', error: { title: 'Something went wrong.', text: 'We could not finish checking Sample Gardens, Lahore. Please try again. Your search is still here.', extra: 'If this keeps happening, tell us.' }, offline: { title: 'No internet connection', text: 'Your phone is not connected to the internet. Check your mobile data or Wi-Fi, then try again.', extra: 'Once you are back online, tap Try again and we will continue.' } },
  ur: { dir: 'rtl', name: 'اردو', retry: 'دوبارہ کوشش کریں', home: 'ہوم پر جائیں', help: 'واٹس ایپ پر مدد لیں', error: { title: 'کچھ غلط ہو گیا۔', text: 'ہم سیمپل گارڈنز، لاہور کی جانچ مکمل نہیں کر سکے۔ براہِ کرم دوبارہ کوشش کریں۔ آپ کی تلاش محفوظ ہے۔', extra: 'اگر یہ بار بار ہو تو ہمیں بتائیں۔' }, offline: { title: 'انٹرنیٹ سے رابطہ نہیں', text: 'آپ کا فون انٹرنیٹ سے جڑا ہوا نہیں۔ موبائل ڈیٹا یا وائی فائی چیک کریں، پھر دوبارہ کوشش کریں۔', extra: 'انٹرنیٹ واپس آنے پر دوبارہ کوشش کریں دبائیں، ہم وہیں سے جاری رکھیں گے۔' } }
};
class Component extends DCLogic {
  renderVals() {
    var k = (this.state && this.state.lang) || this.props.startLang || 'en';
    var kind = this.props.kind || 'error';
    var t = PS[k]; var self = this;
    return {
      t: t, c: t[kind], lang: k, dir: t.dir, langClass: 'L L-' + k,
      isError: kind === 'error', isOffline: kind === 'offline',
      langs: ['en', 'ur'].map(function (c) { return { label: PS[c].name, cls: 'lb lb-' + c + (c === k ? ' on' : ''), pressed: c === k ? 'true' : 'false', pick: function () { self.setState({ lang: c }); } }; })
    };
  }
}
</script>
</body>
</html>
